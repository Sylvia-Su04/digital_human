# 数字人自动化流水线配置文件
# 修改这里的参数即可，不用动主脚本

[paths]
# GPT-SoVITS 目录
gpt_sovits_dir = D:\digital_human\GPT-SoVITS
# LivePortrait 目录
liveportrait_dir = D:\digital_human\LivePortrait
# Python 解释器路径
python_path = D:\conda_envs\digital_human\python.exe
# ffmpeg 路径
ffmpeg_path = D:\conda_envs\digital_human\Library\bin\ffmpeg.exe
# 输出目录
output_dir = D:\digital_human\output
# 临时文件目录
temp_dir = D:\digital_human\temp

[tts]
# GPT 模型路径（相对于 GPT-SoVITS 目录）
gpt_model = GPT_weights_v2Pro/Su_emotional-e15.ckpt
# SoVITS 模型路径（相对于 GPT-SoVITS 目录）
# 注意：Su_emotional_e5_s215.pth 有版本问题，先用旧模型
sovits_model = SoVITS_weights_v2Pro/Su_e4_s148.pth
# 参考音频路径（必须 3~10 秒）
ref_audio = D:\digital_human\ref_clip.wav
# 参考音频文本（参考音频里说的话）
ref_text = 加油呀，你已经很棒了，真的。
# 参考音频语言
ref_language = 中文
# 目标语言
target_language = 中文

[liveportrait]
# 源图片路径（数字人的脸）
source_image = D:\digital_human\LivePortrait\ref\face.jpg
# 驱动视频路径（提供动作，可以是 .mp4 或 .pkl）
driving_video = D:\digital_human\LivePortrait\ref\ceshi.pkl
# 是否裁剪驱动视频
crop_driving = True
# 是否拼接（推荐 True）
stitching = True
# 是否贴回背景（推荐 True）
pasteback = True
# 驱动方式：expression-friendly 或 pose-friendly
driving_option = expression-friendly

[merge]
# 输出视频文件名前缀
output_prefix = digital_human
